name = "sol-notify"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "0.0.0.0"
port = 8788

[vars]
ENVIRONMENT = "development"
# API_KEY, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

# sol-api is reached through a service binding (env.SOL_API), not a URL:
# Worker-to-Worker calls stay inside Cloudflare, and a plain fetch() to
# another Worker on the same workers.dev subdomain fails with "error code:
# 1042" anyway. Bindings aren't inherited, so each environment declares its
# own. Locally, `wrangler dev` connects this to sol-api's own `wrangler dev`
# session (Worker name "sol-api") when it's running.
[[services]]
binding = "SOL_API"
service = "sol-api"

[observability]
enabled = true

# Ephemeral per-PR previews (SOL-17). .github/workflows/pr.yml rewrites this
# name to sol-notify-pr-<N> in its own checkout before deploying — keep the
# line exactly `name = "sol-notify-preview"` so that substitution matches.
[env.preview]
name = "sol-notify-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
# API_KEY, SOL_API_KEY, MAILTRAP_API_TOKEN, MAILTRAP_INBOX_ID are Cloudflare Secrets — not set here

[[env.preview.services]]
binding = "SOL_API"
service = "sol-api-dev"

[env.preview.observability]
enabled = true

[env.staging]
name = "sol-notify-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# API_KEY, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[[env.staging.services]]
binding = "SOL_API"
service = "sol-api-staging"

[env.staging.observability]
enabled = true

[env.production]
name = "sol-notify"

[env.production.vars]
ENVIRONMENT = "production"
# API_KEY, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[[env.production.services]]
binding = "SOL_API"
service = "sol-api"

[env.production.observability]
enabled = true
