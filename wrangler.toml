name = "sol-notify"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serves the default Sol Software banner (public/banner.png) at a stable,
# absolute-URL-able path — email clients need a real fetchable URL, not a
# bundled asset, and this works identically in dev/staging/production/PR
# previews without any separate hosting to set up. Static-asset requests are
# served before the Worker's own fetch handler runs, so this needs no route
# registered in src/index.ts.
[assets]
directory = "./public"

[dev]
ip = "0.0.0.0"
port = 8788

[vars]
ENVIRONMENT = "development"
# API_KEY, SOL_API_URL, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[observability]
enabled = true
