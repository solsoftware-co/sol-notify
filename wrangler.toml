name = "sol-notify"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# global_fetch_strictly_public: route outbound fetch() over the public
# internet. Without it, calling sol-api on the same account's workers.dev
# subdomain fails with Cloudflare "error code: 1042" (Worker-to-Worker
# fetch on the same zone). A service binding would avoid the public hop
# entirely — not done yet.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[dev]
ip = "0.0.0.0"
port = 8788

[vars]
ENVIRONMENT = "development"
# API_KEY, SOL_API_URL, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[observability]
enabled = true

[env.staging]
name = "sol-notify-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# API_KEY, SOL_API_URL, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[env.staging.observability]
enabled = true

[env.production]
name = "sol-notify"

[env.production.vars]
ENVIRONMENT = "production"
# API_KEY, SOL_API_URL, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[env.production.observability]
enabled = true
