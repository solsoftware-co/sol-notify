name = "sol-notify"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "0.0.0.0"
port = 8788

[vars]
ENVIRONMENT = "development"
# API_KEY, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

# sol-api is reached through a service binding (env.SOL_API), not a URL:
# Worker-to-Worker calls stay inside Cloudflare, and a plain fetch() to
# another Worker on the same workers.dev subdomain fails with "error code:
# 1042" anyway. Bindings aren't inherited, so each environment declares its
# own. Locally, `wrangler dev` connects this to sol-api's own `wrangler dev`
# session (Worker name "sol-api") when it's running.
[[services]]
binding = "SOL_API"
service = "sol-api"

[observability]
enabled = true

# Ephemeral per-PR previews (SOL-17). .github/workflows/pr.yml rewrites this
# name to sol-notify-pr-<N> in its own checkout before deploying — keep the
# line exactly `name = "sol-notify-preview"` so that substitution matches.
# Unlike staging/production, previews keep a public workers.dev URL
# (API-key protected) so the e2e suite can reach them; they're safe to expose
# because they only ever send into the Mailtrap sandbox and SOL_API points at
# sol-api-dev.
[env.preview]
name = "sol-notify-preview"
workers_dev = true

[env.preview.vars]
ENVIRONMENT = "preview"
# API_KEY, SOL_API_KEY, MAILTRAP_API_TOKEN, MAILTRAP_INBOX_ID are Cloudflare Secrets — not set here

[[env.preview.services]]
binding = "SOL_API"
service = "sol-api-dev"

[env.preview.observability]
enabled = true

# Staging and production are internal-only (SOL-37): no workers.dev URL,
# reachable only through a service binding from Workers in this account (Sol
# Gate, later the analytics scheduler and sol-logmon). A public service that
# sends whatever it's given from notifications@solsoftware.co would be an
# open relay the moment its key leaked. X-API-Key is still checked as a
# second layer.
[env.staging]
name = "sol-notify-staging"
workers_dev = false

[env.staging.vars]
ENVIRONMENT = "staging"
# API_KEY, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[[env.staging.services]]
binding = "SOL_API"
service = "sol-api-staging"

[env.staging.observability]
enabled = true

[env.production]
name = "sol-notify"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"
# API_KEY, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[[env.production.services]]
binding = "SOL_API"
service = "sol-api"

[env.production.observability]
enabled = true
