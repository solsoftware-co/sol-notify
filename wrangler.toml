name = "sol-notify"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
ip = "0.0.0.0"
port = 8788

[vars]
ENVIRONMENT = "development"
# API_KEY, SOL_API_URL, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[observability]
enabled = true

[env.staging]
name = "sol-notify-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# API_KEY, SOL_API_URL, SOL_API_KEY, RESEND_API_KEY are Cloudflare Secrets — not set here

[env.staging.observability]
enabled = true
